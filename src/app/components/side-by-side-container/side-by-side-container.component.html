<div class="side-by-side-container" [class.vertical]="layout === 'vertical'">
  <!-- Header -->
  <div class="container-header">
    <h2 class="container-title">{{ title }}</h2>
    <div class="header-actions">
      <button 
        *ngIf="showSaveButton"
        type="button" 
        class="btn-primary" 
        (click)="onSave()"
      >
        💾 Save
      </button>
      
      <label *ngIf="showAdvancedMode" class="advanced-toggle">
        <input type="checkbox" [checked]="isAdvancedMode()" (change)="toggleAdvancedMode()" />
        <span class="toggle-label">Advanced Mode</span>
      </label>
      
      <label *ngIf="showThemeToggle" class="theme-toggle" title="Toggle theme">
        <input type="checkbox" [checked]="isDarkTheme()" (change)="toggleTheme()" />
        <span class="toggle-slider"></span>
        <span class="toggle-icon">{{ isDarkTheme() ? '🌙' : '☀️' }}</span>
      </label>
      
      <button 
        type="button" 
        class="btn-icon" 
        (click)="clearAll()"
        title="Clear All"
      >
        🗑️
      </button>
    </div>
  </div>

  <!-- Side-by-Side Panels -->
  <div class="panels-container" [formGroup]="activeForm">
    <!-- Left Panel: Logical Rule -->
    <div class="panel left-panel">
      <div class="panel-header">
        <span class="panel-title">Logical Rule Statement</span>
      </div>
      <app-generic-rule-editor
        [formControlName]="logicalRuleControlName"
        [showExamples]="true"
        [showHelp]="true"
        [showTokenPreview]="true"
        [minHeight]="'400px'"
        (ruleChanged)="onLogicalRuleChanged($event)"
        (tokensChanged)="onTokensChanged($event)"
      ></app-generic-rule-editor>
    </div>

    <!-- Right Panel: Drools Expression -->
    <div class="panel right-panel">
      <div class="panel-header">
        <span class="panel-title">DROOLS Rule Expression</span>
      </div>
      <app-drools-editor
        [formControlName]="droolsControlName"
        [autoGenerate]="autoGenerateDrools"
        [showCopyButton]="true"
        [showExamples]="true"
        [minHeight]="'400px'"
        (generateRequested)="onDroolsGenerateRequested()"
      ></app-drools-editor>
    </div>
  </div>
</div>
